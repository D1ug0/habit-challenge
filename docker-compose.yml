services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: habit_challenge
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
    ports:
      - '5433:5432'
    volumes:
      - habit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habit -d habit_challenge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habit-postgres:
